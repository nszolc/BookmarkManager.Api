<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: {
            950: '#0a0a0a',
            900: '#141414',
            850: '#1a1a1a',
            input: '#111111',
            border: '#222222',
            'border-h': '#333333',
          },
          dim: '#555555',
          accent: '#2ecc71',
          'accent-h': '#27ae60',
          danger: '#e74c3c',
        },
        fontFamily: {
          sans: ['Nunito', 'sans-serif'],
          mono: ['Space Mono', 'monospace'],
        },
        keyframes: {
          slideUp: {
            from: { transform: 'translateY(15px)', opacity: '0' },
            to: { transform: 'translateY(0)', opacity: '1' },
          },
        },
        animation: {
          slideUp: 'slideUp 0.25s ease',
        },
      },
    },
  }
</script>
<style type="text/tailwindcss">
  @layer base {
    body { @apply bg-ink-950 text-neutral-400 font-sans min-h-screen; }
  }
  @layer components {
    .btn {
      @apply inline-flex items-center gap-1 px-4 py-2 border border-ink-border rounded-md bg-ink-900 text-neutral-400 text-sm font-semibold cursor-pointer transition whitespace-nowrap no-underline;
    }
    .btn:hover { @apply border-ink-border-h text-neutral-200; }
    .btn-add { @apply bg-accent border-accent text-black font-bold; }
    .btn-add:hover { @apply bg-accent-h border-accent-h text-black; }
    .btn-danger { @apply text-danger; }
    .btn-danger:hover { @apply border-danger; }
    .btn-sm { @apply px-2 py-1 text-xs; }
    .btn-ghost { @apply bg-transparent border-transparent px-1.5 py-1; }
    .btn-ghost:hover { @apply bg-ink-850 border-transparent; }
    .input-base {
      @apply w-full px-3 py-2 bg-ink-input border border-ink-border rounded-md text-neutral-200 text-sm outline-none transition-colors;
    }
    .input-base:focus { @apply border-accent; }
    .input-base::placeholder { @apply text-dim; }
    .nav-link {
      @apply flex items-center gap-2 px-3 py-2 rounded-md text-sm font-semibold text-neutral-400 no-underline transition-colors;
    }
    .nav-link:hover { @apply bg-ink-850 text-neutral-200; }
    .nav-link-active {
      @apply bg-accent/10 text-accent border border-accent/30;
    }
    .nav-link-active:hover { @apply bg-accent/20 text-accent; }
    .nav-sublink {
      @apply flex items-center gap-1.5 pl-5 pr-3 py-1 rounded text-[0.78rem] text-dim no-underline transition-colors;
    }
    .nav-sublink:hover { @apply text-accent bg-ink-850; }
  }
</style>
</head>
<body>

<div class="md:flex md:min-h-screen">

  <aside class="md:w-60 md:sticky md:top-0 md:h-screen md:flex-shrink-0 border-b md:border-b-0 md:border-r border-ink-border p-6 md:overflow-y-auto">
    <div class="font-mono text-[0.7rem] text-accent tracking-[3px] uppercase mb-6 opacity-80">// bookmark manager</div>
    <nav class="flex md:flex-col gap-1 flex-wrap">
      <div class="md:mb-2">
        <a href="/" class="nav-link nav-link-active">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[18px] h-[18px] flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" /></svg>
          Bookmarks
        </a>
        <div class="hidden md:flex md:flex-col gap-0.5 mt-1">
          <a href="/?action=add" class="nav-sublink">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
            Add new
          </a>
          <a href="/favorites" class="nav-sublink">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 flex-shrink-0"><path d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006Z" /></svg>
            Favorites only
          </a>
        </div>
      </div>
      <div class="md:mb-2">
        <a href="/categories" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[18px] h-[18px] flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" /></svg>
          Categories
        </a>
        <div class="hidden md:flex md:flex-col gap-0.5 mt-1">
          <a href="/categories?action=add" class="nav-sublink">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
            Add new
          </a>
          <a href="/categories?action=delete" class="nav-sublink">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
            Delete
          </a>
        </div>
      </div>
      <div class="md:mb-2">
        <a href="/tags" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-[18px] h-[18px] flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" /></svg>
          Tags
        </a>
        <div class="hidden md:flex md:flex-col gap-0.5 mt-1">
          <a href="/tags?action=add" class="nav-sublink">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
            Add new
          </a>
          <a href="/tags?action=delete" class="nav-sublink">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
            Delete
          </a>
        </div>
      </div>
    </nav>
  </aside>

  <main class="flex-1 max-w-[880px] px-6 pt-10 pb-20 mx-auto md:mx-0 w-full">

    <header class="mb-8 pb-6 border-b border-ink-border">
      <h1 class="text-3xl font-extrabold text-neutral-200 -tracking-[0.03em] leading-tight">My <span class="text-accent">Bookmarks</span></h1>
      <p class="text-dim text-[0.85rem] mt-1">Your personal link collection</p>
    </header>

    <div class="flex gap-8 mb-6 flex-wrap" id="stats"></div>

    <div class="flex gap-2 mb-6 flex-wrap items-center">
      <input type="text" id="searchInput" placeholder="Search bookmarks..."
        class="flex-1 min-w-[160px] px-3 py-2 bg-ink-input border border-ink-border rounded-md text-neutral-200 text-sm outline-none transition-colors focus:border-accent placeholder:text-dim">
      <button class="btn" onclick="applyFilters()" title="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
        Search
      </button>
      <select id="catFilter" class="px-3 py-2 bg-ink-input border border-ink-border rounded-md text-neutral-400 text-sm outline-none cursor-pointer">
        <option value="">All categories</option>
      </select>
      <button class="btn btn-add" onclick="openModal()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        Add
      </button>
    </div>

    <div id="favBadge" class="hidden mb-4 inline-flex items-center gap-2 px-3 py-1.5 bg-accent/10 border border-accent/30 rounded-md text-accent text-xs font-semibold">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5"><path d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006Z" /></svg>
      Showing favorites only
      <button onclick="clearFavorites()" class="text-accent hover:text-accent-h" title="Clear filter">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="flex flex-col gap-1" id="bmList"></div>

  </main>

</div>

<!-- ── Modal ── -->
<div class="hidden fixed inset-0 bg-black/70 z-[100] items-center justify-center backdrop-blur-sm data-[open=true]:flex"
     id="modalBg" data-open="false" onclick="if(event.target===this)closeModal()">
  <div class="bg-ink-900 border border-ink-border rounded-[10px] p-7 w-[90%] max-w-[480px] max-h-[90vh] overflow-y-auto">
    <h2 id="modalTitle" class="text-[1.05rem] font-bold text-neutral-200 mb-5">Add Bookmark</h2>
    <input type="hidden" id="editId">

    <div class="mb-3">
      <label class="block text-xs font-semibold text-dim mb-1 uppercase tracking-wider">Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Microsoft Learn C#" class="input-base">
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-dim mb-1 uppercase tracking-wider">URL</label>
      <input type="url" id="fUrl" placeholder="https://..." class="input-base">
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-dim mb-1 uppercase tracking-wider">Description (optional)</label>
      <textarea id="fDesc" placeholder="Short note about this link" class="input-base resize-y min-h-[65px]"></textarea>
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-dim mb-1 uppercase tracking-wider">Category</label>
      <select id="fCat" class="input-base"></select>
    </div>
    <div class="mb-3">
      <label class="block text-xs font-semibold text-dim mb-1 uppercase tracking-wider">Tags</label>
      <div class="flex flex-wrap gap-2" id="fTags"></div>
    </div>

    <div class="flex justify-end gap-2 mt-5">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-add" onclick="saveBookmark()">Save</button>
    </div>
  </div>
</div>

<script>
const API = '/api';

// Heroicons (https://heroicons.com) — outline set, rendered inline as SVG.
const ICON_PATHS = {
  plus: 'M12 4.5v15m7.5-7.5h-15',
  star: 'M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z',
  trash: 'm14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0',
  search: 'm21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z',
  edit: 'm16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10',
  inbox: 'M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661Z',
};

function icon(name, cls = 'w-5 h-5') {
  return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="${cls}"><path stroke-linecap="round" stroke-linejoin="round" d="${ICON_PATHS[name]}" /></svg>`;
}

const STAR_SOLID = 'M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006Z';

function starIcon(filled, cls = 'w-5 h-5') {
  return filled
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="${cls}"><path d="${STAR_SOLID}" /></svg>`
    : icon('star', cls);
}

function hexToRgba(hex, alpha) {
  const h = (hex || '').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  if (full.length !== 6) return `rgba(107,114,128,${alpha})`; // fallback grey
  const r = parseInt(full.slice(0, 2), 16);
  const g = parseInt(full.slice(2, 4), 16);
  const b = parseInt(full.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function catBadgeStyle(hex) {
  const color = hex || '#6b7280';
  return `background:${hexToRgba(color, 0.12)};color:${color};border:1px solid ${hexToRgba(color, 0.3)}`;
}

let categories = [];
let tags = [];
let bookmarks = [];
let favOnly = false;

function setFavOnly(value) {
  favOnly = value;
  document.getElementById('favBadge').classList.toggle('hidden', !favOnly);
}

function clearFavorites() {
  // Favorites is its own route — leaving the filter means navigating home.
  window.location.href = '/';
}

async function init() {
  try {
    const [catRes, tagRes] = await Promise.all([
      fetch(`${API}/categories`),
      fetch(`${API}/tags`)
    ]);

    if (!catRes.ok || !tagRes.ok) throw new Error('API error');

    categories = await catRes.json();
    tags = await tagRes.json();

    renderCatFilter();
    renderTagChecks();
    await applyFilters();
  } catch (err) {
    toast('Cannot connect to API. Is the server running?', 'err');
    console.error(err);
  }
}

async function applyFilters() {
  const search = document.getElementById('searchInput').value.trim();
  const catId = document.getElementById('catFilter').value;

  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (catId) params.set('categoryId', catId);
  if (favOnly) params.set('favorite', 'true');

  const url = params.toString() ? `${API}/bookmarks?${params}` : `${API}/bookmarks`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`API error (${res.status})`);
    bookmarks = await res.json();
    renderBookmarkList();
    renderStats();
  } catch (err) {
    toast('Failed to load bookmarks', 'err');
    console.error(err);
  }
}

function renderBookmarkList() {
  const list = document.getElementById('bmList');
  const hasFilters = !!(
    document.getElementById('searchInput').value.trim() ||
    document.getElementById('catFilter').value ||
    favOnly
  );

  if (bookmarks.length === 0) {
    list.innerHTML = `
      <div class="text-center py-16 px-8 text-dim text-sm">
        <div class="flex justify-center mb-3">${icon(hasFilters ? 'search' : 'inbox', 'w-10 h-10')}</div>
        ${hasFilters
          ? 'No bookmarks match your filters.'
          : 'No bookmarks yet. Click <strong>+ Add</strong> to create one.'}
      </div>`;
    return;
  }

  list.innerHTML = bookmarks.map(b => {
    const catStyle = catBadgeStyle(b.categoryColor);
    const tagHtml = (b.tags || []).map(t =>
      `<span class="text-[0.62rem] px-1.5 py-0.5 rounded-sm bg-accent/10 text-accent border border-accent/30 font-mono">#${esc(t.name)}</span>`
    ).join('');

    return `
      <div class="bg-ink-900 border border-ink-border rounded-md px-4 py-3 flex items-start gap-3 transition-colors hover:border-ink-border-h hover:bg-ink-850">
        <button class="bg-transparent border-none cursor-pointer p-0 flex-shrink-0 mt-0.5 transition-transform hover:scale-125 ${b.isFavorite ? 'text-accent' : 'text-dim hover:text-accent'}" onclick="toggleFav(${b.id})" title="Toggle favorite">
          ${starIcon(b.isFavorite, 'w-5 h-5')}
        </button>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-neutral-200 text-[0.9rem] mb-0.5">
            <a href="${esc(b.url)}" target="_blank" rel="noopener" class="text-inherit no-underline transition-colors hover:text-accent">${esc(b.title)}</a>
          </div>
          <div class="font-mono text-[0.65rem] text-dim break-all -tracking-[0.02em]">${esc(b.url)}</div>
          ${b.description ? `<div class="text-[0.8rem] text-neutral-400 mt-1 leading-normal">${esc(b.description)}</div>` : ''}
          <div class="flex gap-1.5 mt-2 flex-wrap items-center">
            <span class="text-[0.62rem] font-bold px-2 py-0.5 rounded-sm uppercase tracking-wider font-mono" style="${catStyle}">
              ${esc(b.categoryName || 'Unknown')}
            </span>
            ${tagHtml}
          </div>
        </div>
        <div class="flex gap-1 flex-shrink-0 mt-0.5">
          <button class="btn btn-ghost btn-sm" onclick="editBm(${b.id})" title="Edit">${icon('edit', 'w-4 h-4')}</button>
          <button class="btn btn-ghost btn-sm btn-danger" onclick="deleteBm(${b.id})" title="Delete">${icon('trash', 'w-4 h-4')}</button>
        </div>
      </div>`;
  }).join('');
}

function renderCatFilter() {
  const sel = document.getElementById('catFilter');
  const fSel = document.getElementById('fCat');

  sel.innerHTML = '<option value="">All categories</option>' +
    categories.map(c => `<option value="${c.id}">${c.name} (${c.bookmarkCount || c.bookmarksCount || 0})</option>`).join('');

  fSel.innerHTML = categories.map(c =>
    `<option value="${c.id}">${c.name}</option>`
  ).join('');
}

function renderTagChecks() {
  document.getElementById('fTags').innerHTML = tags.length
    ? tags.map(t =>
        `<label class="inline-flex items-center gap-1 text-sm text-neutral-400 cursor-pointer normal-case tracking-normal"><input type="checkbox" value="${t.id}"> ${esc(t.name)}</label>`
      ).join('')
    : '<span class="text-dim text-sm">No tags yet. <a href="/tags" class="text-accent">Create one →</a></span>';
}

function renderStats() {
  const fav = bookmarks.filter(b => b.isFavorite).length;
  document.getElementById('stats').innerHTML = `
    <div class="text-xs text-dim"><strong class="text-accent font-mono text-lg">${bookmarks.length}</strong><span class="block text-[0.7rem] uppercase tracking-wider mt-0.5">bookmarks</span></div>
    <div class="text-xs text-dim"><strong class="text-accent font-mono text-lg">${fav}</strong><span class="block text-[0.7rem] uppercase tracking-wider mt-0.5">favorites</span></div>
    <div class="text-xs text-dim"><strong class="text-accent font-mono text-lg">${categories.length}</strong><span class="block text-[0.7rem] uppercase tracking-wider mt-0.5">categories</span></div>
    <div class="text-xs text-dim"><strong class="text-accent font-mono text-lg">${tags.length}</strong><span class="block text-[0.7rem] uppercase tracking-wider mt-0.5">tags</span></div>
  `;
}

async function saveBookmark() {
  const editId = document.getElementById('editId').value;
  const title = document.getElementById('fTitle').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  const description = document.getElementById('fDesc').value.trim() || null;
  const categoryId = parseInt(document.getElementById('fCat').value);
  const tagIds = [...document.querySelectorAll('#fTags input:checked')].map(c => parseInt(c.value));

  if (!title || !url) {
    toast('Title and URL are required', 'err');
    return;
  }

  const body = { title, url, description, categoryId, tagIds };

  try {
    let res;
    if (editId) {
      res = await fetch(`${API}/bookmarks/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } else {
      res = await fetch(`${API}/bookmarks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast(err.message || 'Something went wrong', 'err');
      return;
    }

    toast(editId ? 'Bookmark updated' : 'Bookmark created', 'ok');
    closeModal();
    await reload();
  } catch (err) {
    toast('Network error', 'err');
    console.error(err);
  }
}

async function deleteBm(id) {
  if (!confirm('Delete this bookmark?')) return;
  try {
    const res = await fetch(`${API}/bookmarks/${id}`, { method: 'DELETE' });
    if (res.ok || res.status === 204) {
      toast('Deleted', 'ok');
      await reload();
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.message || `Failed to delete (${res.status})`, 'err');
    }
  } catch (err) {
    toast('Failed to delete', 'err');
  }
}

async function toggleFav(id) {
  try {
    const res = await fetch(`${API}/bookmarks/${id}/favorite`, { method: 'PATCH' });
    if (res.ok) {
      if (favOnly) {
        await applyFilters();
      } else {
        const updated = await res.json();
        const idx = bookmarks.findIndex(b => b.id === id);
        if (idx !== -1) bookmarks[idx] = updated;
        renderBookmarkList();
        renderStats();
      }
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.message || `Failed to update (${res.status})`, 'err');
    }
  } catch (err) {
    toast('Failed to update', 'err');
  }
}

async function reload() {
  const catRes = await fetch(`${API}/categories`);
  categories = await catRes.json();
  renderCatFilter();
  await applyFilters();
}

let searchDebounce;
function onSearchInput() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(applyFilters, 300);
}

function openModal(bm = null) {
  document.getElementById('modalBg').setAttribute('data-open', 'true');
  document.getElementById('modalTitle').textContent = bm ? 'Edit Bookmark' : 'Add Bookmark';
  document.getElementById('editId').value = bm ? bm.id : '';
  document.getElementById('fTitle').value = bm ? bm.title : '';
  document.getElementById('fUrl').value = bm ? bm.url : '';
  document.getElementById('fDesc').value = bm ? (bm.description || '') : '';
  document.getElementById('fCat').value = bm ? bm.categoryId : (categories[0]?.id || '');

  document.querySelectorAll('#fTags input').forEach(cb => {
    cb.checked = bm ? (bm.tags || []).some(t => t.id === parseInt(cb.value)) : false;
  });
}

function closeModal() {
  document.getElementById('modalBg').setAttribute('data-open', 'false');
}

function editBm(id) {
  const bm = bookmarks.find(b => b.id === id);
  if (bm) openModal(bm);
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toast(msg, type = 'ok') {
  const old = document.querySelector('[data-toast]');
  if (old) old.remove();
  const t = document.createElement('div');
  t.setAttribute('data-toast', '');
  const color = type === 'ok' ? 'bg-accent text-black' : 'bg-danger text-white';
  t.className = `fixed bottom-6 right-6 px-5 py-3 rounded-md text-sm font-semibold z-[200] animate-slideUp font-sans ${color}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

document.getElementById('searchInput').addEventListener('input', onSearchInput);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(searchDebounce);
    applyFilters();
  }
});
document.getElementById('catFilter').addEventListener('change', applyFilters);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function handleQueryAction() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('action') === 'add') {
    history.replaceState({}, '', window.location.pathname);
    openModal();
  }
}

(async () => {
  // The /favorites route shows the favorites-only view.
  setFavOnly(window.location.pathname === '/favorites');
  await init();
  handleQueryAction();
})();
</script>
</body>
</html>
